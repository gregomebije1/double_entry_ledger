spring.application.name=double_entry_ledger

# Logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.file.name=app.log

# Database
# Setting stringtype=unspecified forces the PostgreSQL JDBC driver to let the database engine automatically cast the incoming Java string values straight into your native custom account_type enum structure seamlessly
spring.datasource.url=jdbc:postgresql://localhost:5432/double_entry_ledger?stringtype=unspecified
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres


# Flyway
spring.flyway.enabled=true
# If you are running against a database that already has tables, set this to true
spring.flyway.baseline-on-migrate=true 
spring.flyway.locations=classpath:db/migration

# JPA
# CRITICAL: Force Hibernate to validate only, preventing it from fighting Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=redis
spring.data.redis.port=6379


